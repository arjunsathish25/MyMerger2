<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Glass Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Note: Background is handled by the parent page in integration */
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loader-container {
            position: relative;
            width: 200px;
            height: 200px;
        }
        
        .glass-card {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            animation: float 3s ease-in-out infinite;
        }

        /* Using nth-of-type for correct targeting */
        .glass-card:nth-of-type(1) {
            top: 0;
            left: 0;
            animation-delay: 0s;
            background: rgba(255, 98, 31, 0.15);
        }

        .glass-card:nth-of-type(2) {
            top: 0;
            right: 0;
            animation-delay: -0.5s;
            background: rgba(255, 120, 78, 0.15);
        }

        .glass-card:nth-of-type(3) {
            bottom: 0;
            left: 0;
            animation-delay: -1s;
            background: rgba(255, 98, 31, 0.2);
        }

        .glass-card:nth-of-type(4) {
            bottom: 0;
            right: 0;
            animation-delay: -1.5s;
            background: rgba(255, 120, 78, 0.2);
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.05);
            }
        }
        
        .center-element {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1);
                box-shadow: 0 16px 50px rgba(255, 98, 31, 0.2);
            }
        }
        
        .dots {
            display: flex;
            gap: 6px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background: #ff621f;
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        
        .dot:nth-child(1) {
            animation-delay: 0s;
        }
        
        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes dotPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }
        
        .orbit-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 140px;
            height: 140px;
            margin: -70px 0 0 -70px;
            border: 2px solid rgba(255, 98, 31, 0.2);
            border-radius: 50%;
            animation: rotate 4s linear infinite;
        }
        
        .orbit-ring::before {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #ff621f;
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(255, 98, 31, 0.5);
        }
        
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .loader-container {
                width: 150px;
                height: 150px;
            }
            
            .glass-card {
                width: 60px;
                height: 60px;
                border-radius: 15px;
            }
            
            .center-element {
                width: 45px;
                height: 45px;
                border-radius: 12px;
            }
            
            .orbit-ring {
                width: 110px;
                height: 110px;
                margin: -55px 0 0 -55px;
            }
            
            .dot {
                width: 6px;
                height: 6px;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <!-- Orbit ring -->
        <div class="orbit-ring"></div>
        
        <!-- Glass cards -->
        <div class="glass-card"></div>
        <div class="glass-card"></div>
        <div class="glass-card"></div>
        <div class="glass-card"></div>
        
        <!-- Center element with dots -->
        <div class="center-element">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>
</html>
