<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  <script src="https://unpkg.com/feather-icons"></script>
  
</head>

<body class="login-page">
  <div class="page-content">
    <div class="login-container">
      <div class="animation-container">
        <!-- Dog Animation HTML -->
        <div class="husky" id="husky-dog">
          <div class="mane">
            <div class="coat"></div>
          </div>
          <div class="body">
            <div class="head">
              <div class="ear"></div>
              <div class="ear"></div>
              <div class="face">
                <div class="eye"></div>
                <div class="eye"></div>
                <div class="nose"></div>
                <div class="mouth">
                  <div class="lips"></div>
                  <div class="tongue"></div>
                </div>
              </div>
            </div>
            <div class="torso"></div>
          </div>
          <div class="legs">
            <div class="front-legs">
              <div class="leg"></div>
              <div class="leg"></div>
            </div>
            <div class="hind-leg">
            </div>
          </div>
          <div class="tail">
            <div class="tail"><div class="tail"><div class="tail"><div class="tail"><div class="tail"><div class="tail"></div></div></div></div></div></div>
          </div>
        </div>
      </div>
      <div class="login-card">
        <div class="login-header">
          <h2>Welcome Back!</h2>
          <p>Please enter your details to sign in.</p>
        </div>
          <form class="login-form" method="POST" action="{{ url_for('login') }}">
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <i data-feather="user" class="input-icon" id="username-icon"></i>
              <input type="text" id="username" name="username" placeholder="username" required autocomplete="off">
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i data-feather="lock" class="input-icon" id="password-icon"></i>
              <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="off">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="login-button">Sign In</button>
          </div>
          <div class="divider"><span>OR</span></div>
          <a href="{{ url_for('ms_login') }}" class="btn btn-microsoft" id="microsoft-login-button">
            <img src="https://www.vectorlogo.zone/logos/microsoft/microsoft-icon.svg" alt="Microsoft Logo" class="microsoft-icon">
            <span>Sign in with Microsoft</span>
          </a>
        </form>
      </div>
    </div>
  </div>
  <script>
    feather.replace()
  </script>
</body>

</html>
